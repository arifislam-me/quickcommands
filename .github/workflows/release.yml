name: Release

# Runs only when you push a version tag such as v1.0.0.
# A normal `git push` (no tag) does nothing here.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub release and upload files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg_version="$(sed -n 's/^Version: //p' DEBIAN/control)"
          tag_version="${TAG#v}"
          echo "tag: $tag_version, DEBIAN/control: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG does not match Version $pkg_version in DEBIAN/control. Fix one of them and tag again."
            exit 1
          fi

      - name: Run checks, run tests, build the .deb
        run: ./build.sh

      - name: Write checksums
        working-directory: dist
        run: sha256sum quickcommands.deb > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/quickcommands.deb \
            dist/SHA256SUMS \
            --title "quickcommands $TAG" \
            --generate-notes
